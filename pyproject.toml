[tool.ruff]
# 3.14 is the floor, not just the interpreter it happens to be developed on:
# the code relies on PEP 649 lazy annotations, so forward references are written
# unquoted and would raise NameError at def time on anything older.
target-version = "py314"
line-length = 120
extend-exclude = ["build", "build_pyi", "dist"]

[tool.ruff.lint]
# Pyflakes (real errors — undefined names, unused imports/variables) plus B905:
# every zip() says whether its inputs must be the same length (strict=True) or
# may be cut short (strict=False), so a round or dance list that runs short
# fails loudly instead of losing its tail.
#
# The idiom sets below are on too — none of them reformat code, they only flag
# a construction that has a shorter equivalent: an unsorted import block, a
# typing name that moved to collections.abc (UP035), an annotation still
# written in quotes although PEP 649 made it lazy without them (UP037), a
# try/except/pass that is contextlib.suppress (SIM105), a loop that appends
# into a list (PERF401).
#
# C901 caps McCabe complexity as a ratchet: nothing fails at 25 today, and any
# new function over it does. The two worst left are `_build_suspects_table`
# (24) and `keyPressEvent` (23); the rest of the over-20 set are Qt event
# handlers and menu builders, where the if-chain is the dispatch table and
# flattening it to satisfy a number would read worse.
select = ["F", "B905", "I", "UP", "SIM", "C4", "PERF", "PIE", "C901"]
ignore = [
    # Joins if/elif branches that share a body. On a chain of short guards it
    # produces one long line that no longer reads as a list of cases, so the
    # combination stays written out (see library_browser._refilter).
    "SIM114",
    # Would merge `with a:, with b:` into one statement with four managers.
    # Nested `with` says which block releases what; the merged form does not.
    "SIM117",
    # Percent formatting: the remaining sites are one-line format strings whose
    # only rewrite is a formatter call. Left as they read.
    "UP031",
    # `dict()`, `list()`, `tuple()` where a literal would do. Triggers on the
    # `dict(row)` / `tuple(x)` conversions over sqlite rows and iterables, where
    # the call is the conversion and the literal is not equivalent.
    "C408",
    # Reads the Windows environment's own misspelt 'ProgramFiles(x86)' key.
    "SIM112",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.isort]
# The app's own top-level packages, so they sort under first-party rather than
# being guessed from the directory layout.
known-first-party = ["planner", "gui", "player", "shared", "tools"]

[tool.ruff.lint.per-file-ignores]
# The facade re-exports planner symbols on purpose.
"dancesport_planner.py" = ["F401"]
# The dialog package re-exports its classes the same way, from below a module
# docstring and the Qt imports they are built on.
"gui/dialogs/__init__.py" = ["E402"]

[tool.basedpyright]
# Type checking of all app code, in pyright's basic mode (basedpyright's
# default "recommended" is far stricter). basedpyright rather than pyright for
# its baseline: the errors that were there when a directory came in sit in
# .basedpyright/baseline.json and are not reported, a new one fails CI. Fixing
# one shrinks the baseline (a plain run prunes it).
include = ["planner", "gui", "player", "shared", "speech", "tools",
           "dancesport_gui.py", "dancesport_planner.py"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
# Basic mode leaves these off. On, an override that no longer matches its base
# class or stub fails, the parameter names included.
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"

[tool.pytest.ini_options]
# The suite is plain unittest; pytest runs it unchanged and is what slop-mop's
# test gates call. -n auto spreads it over every core (pytest-xdist): ~2 min
# instead of ~12. Pass -n0 to run a single test in-process for debugging.
addopts = "-n auto"
# pytest-cov switches this ResourceWarning on, Python's default leaves it off.
# pytest keeps every recorded warning to the end, the warning its connection,
# and the connection's cached statements its database file: Windows then
# cannot delete the test temp folders.
filterwarnings = ["ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning"]

[tool.coverage.run]
# What slop-mop's coverage gates measure: the app, not its tests. Declaring a
# source makes the gate pass a bare --cov, so this section is honoured.
source = ["."]
omit = [
    "tests/*",
    "conftest.py",
    # Read by the dead-code gate (vulture), never imported.
    "vulture_whitelist.py",
    # PySide6's shiboken runs embedded modules under these names. No such file
    # exists, so `coverage report` would stop on "No source for code".
    "pyscript",
    "signature_bootstrap.py",
    "shibokensupport/*",
]
