name: tests

# The app ships for Windows, macOS and Linux, so the suite runs on all three.
# Windows is the platform the tests were written against and the one that has
# to pass. The macOS and Linux legs are new and may fail (continue-on-error)
# until what they turn up is fixed or skipped; then the flag goes. The GUI
# tests drive Qt through its offscreen platform plugin on every leg.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: "Also send one real event to GlitchTip"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      # Qt's xcb/EGL libraries (as in build-player.yml) and ffmpeg for the
      # audio analysis.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libpulse0 ffmpeg

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          # A call of its own: the lock is hash-checked, and pip then wants a
          # hash for every package on the same command line.
          python -m pip install ruff==0.16.8 basedpyright==1.39.10 -r requirements-dev.txt

      # The same on every platform, so once is enough.
      - name: Lint
        if: runner.os == 'Windows'
        run: python -m ruff check .

      # All app code (not tests/), in basic mode; the errors already there sit in
      # .basedpyright/baseline.json, so only a new one fails (pyproject.toml).
      - name: Type check
        if: runner.os == 'Windows'
        run: basedpyright

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          DANCEPLAYLIST_ERROR_DSN: ${{ secrets.DANCEPLAYLIST_ERROR_DSN }}
          # The live GlitchTip test sends one event, so it runs only when a
          # manual run ticks live_tests (and the secret is there), and only on
          # the Windows leg.
          DANCEPLAYLIST_LIVE_TESTS: ${{ inputs.live_tests && runner.os == 'Windows' && '1' || '' }}
        # pytest, as locally and in slop-mop: the root conftest.py's fixtures
        # only apply under it, and -n auto (pyproject.toml) runs it on every core.
        run: python -m pytest
